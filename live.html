<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>灯塔小岛 · 完整动态 AR</title>
<style>
  :root {
    --foam: #f3f7fb;
    --muted: rgba(243,247,251,.75);
    --sand: #d2b07a;
    --line: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #071018; color: var(--foam);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #cam {
    display: none; position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; background: #000;
  }
  #c {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1;
    touch-action: none; display: block; background: transparent !important;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
  }
  .top h1 { font-size: 18px; font-weight: 750; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .top p { margin-top: 4px; font-size: 12px; color: var(--muted); text-shadow: 0 1px 6px rgba(0,0,0,.45); }
  #banner {
    display: none; margin-top: 10px; padding: 10px 12px; border-radius: 12px;
    background: rgba(255,180,70,.16); border: 1px solid rgba(255,210,120,.4);
    color: #ffe6b0; font-size: 12px; line-height: 1.45; pointer-events: none;
  }
  .bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #hint {
    max-width: 360px; text-align: center; font-size: 13px; line-height: 1.45;
    padding: 10px 12px; border-radius: 12px; background: rgba(8,18,28,.62);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #loadBar {
    display: none; width: min(280px, 70vw); height: 6px; border-radius: 99px;
    background: rgba(255,255,255,.12); overflow: hidden;
  }
  #loadFill { height: 100%; width: 0; background: linear-gradient(90deg, #f0d9a0, #d7ae62); }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; pointer-events: auto; }
  .pill {
    border: 0; border-radius: 999px; padding: 11px 16px; font-size: 13px; font-weight: 700;
    background: rgba(15,28,40,.75); color: var(--foam); cursor: pointer;
  }
  .pill.primary { background: linear-gradient(135deg, #f0d9a0, #d7ae62); color: #08131c; }
  .pill:disabled { opacity: .45; cursor: default; }
  .back {
    pointer-events: auto; position: absolute; right: 14px; top: max(12px, env(safe-area-inset-top));
    font-size: 12px; color: #9fd0e8; text-decoration: none;
    padding: 8px 10px; border-radius: 999px; background: rgba(0,0,0,.35);
  }
</style>
<!-- Local three.js: avoids unpkg CDN failures on mobile networks -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<video id="cam" playsinline webkit-playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="top">
    <a class="back" href="./">静态版 / 首页</a>
    <h1>灯塔小岛 · 动态 AR</h1>
    <p>海浪 · 飞鸟 · 鱼群 · 草地 · 渔夫 · 像素风</p>
    <div id="banner"></div>
  </div>
  <div class="bottom">
    <div id="loadBar"><div id="loadFill"></div></div>
    <div id="hint">正在加载脚本…</div>
    <div class="actions">
      <button class="pill primary" id="btnStart" type="button" disabled>加载动态场景</button>
      <button class="pill primary" id="btnPlace" type="button" style="display:none">放置场景</button>
      <button class="pill" id="btnExit" type="button" style="display:none">退出 AR</button>
      <button class="pill" id="btnPixel" type="button" style="display:none" aria-pressed="true">像素风: 开</button>
      <button class="pill" id="btnQuality" type="button" style="display:none">画质: auto</button>
    </div>
  </div>
</div>
<script>
  window.__LIVE_OK = false;
  window.addEventListener('unhandledrejection', function (e) {
    var h = document.getElementById('hint');
    if (h) h.textContent = '加载失败: ' + ((e.reason && e.reason.message) || e.reason || 'unknown');
  });
  setTimeout(function () {
    if (!window.__LIVE_OK) {
      var h = document.getElementById('hint');
      if (h) h.textContent = '脚本未能启动。请强制刷新（Safari：长按刷新）或换 Chrome 重试。';
    }
  }, 5000);
</script>
<script type="module" src="./live.js"></script>
</body>
</html>
